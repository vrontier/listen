; /etc/php/8.3/fpm/pool.d/listen.conf — PHP-FPM pool for listen.home.arpa.
; Source: github.com/vrontier/listen, deploy/php-fpm/ (installed by
; scripts/deploy-taurus.sh). A separate pool keeps the site out of the shared
; www pool: its own socket, its own open_basedir, no inherited env.
[listen]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-listen.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s

clear_env = yes
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /var/www/listen.home.arpa/:/var/lib/listen-web/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec
php_admin_flag[allow_url_fopen] = off
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
