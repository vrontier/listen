; /etc/php/8.3/fpm/pool.d/listen.conf — PHP-FPM pool for listen.vrontier.org (production).
; Source: github.com/vrontier/listen, deploy/php-fpm/ (installed by the root step
; of scripts/deploy-ionos.sh). Dedicated pool, isolated like [akasha]. The web root
; is owned by questmaster:www-data, so this pool can READ the site but never write
; to it; the only writable place is /var/lib/listen-web (contact form rate limit).
[listen]
user  = listen-web
group = listen-web

listen       = /run/php/php8.3-fpm-listen.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 6
pm.start_servers     = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests      = 500

clear_env = yes
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /var/www/listen.vrontier.org/:/var/lib/listen-web/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[session.cookie_httponly]  = on
php_admin_flag[session.cookie_secure]    = on
php_admin_flag[session.use_strict_mode]  = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[display_errors] = off
php_admin_flag[log_errors]     = on
php_admin_value[error_log]     = /var/log/php8.3-fpm-listen.log
