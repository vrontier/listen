; The Observatory's PHP-FPM pool, a template: /etc/php/<version>/fpm/pool.d/observatory.conf
; The site's directory and the contact form's rate-limit directory are the
; only places PHP may read.
[observatory]
user = www-data
group = www-data
listen = /run/php/php-fpm-observatory.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
clear_env = yes
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /var/www/observatory/:/var/lib/listen-web/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec
php_admin_flag[allow_url_fopen] = off
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
