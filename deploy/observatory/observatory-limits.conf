# Request and connection limits per visitor for the Observatory, a template:
#   /etc/nginx/conf.d/observatory-limits.conf  (http context)
# Used by the site (nginx-site.conf) and by every listener route
# (scripts/apply-sources.sh puts them into listen-sources.conf), so one
# visitor cannot open any number of WebSockets or flood the pages.
limit_req_zone  $binary_remote_addr zone=obs:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=obs_conn:10m;
