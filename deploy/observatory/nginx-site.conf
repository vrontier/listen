# The Observatory's website, a template. Replace observatory.example.org,
# the certificate paths and /var/www/observatory with your own, then:
#   /etc/nginx/sites-available/observatory  (and a link in sites-enabled)
# The per-source routes come from scripts/gen-sources.sh, installed as
# /etc/nginx/snippets/listen-sources.conf. See INSTALL.md.

server {
    listen 80;
    listen [::]:80;
    server_name observatory.example.org;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name observatory.example.org;

    ssl_certificate     /etc/letsencrypt/live/observatory.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observatory.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/security-headers.conf;

    root /var/www/observatory;

    # The site is read-only except for the contact form.
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 444;
    }

    # _lib, _view and _config are never served; neither are dotfiles.
    location ^~ /_ { return 404; }
    location ~ /\. { deny all; }

    location = /robots.txt { try_files /robots.txt =404; access_log off; }

    # Static assets are cache-busted by ?v=mtime.
    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
    }

    # Per-source listener routes (/<slug>/ws/…, /<slug>/api/…).
    include snippets/listen-sources.conf;

    # The contact form is the only page that accepts POST.
    location = /contact {
        limit_except GET HEAD POST { deny all; }
        client_max_body_size 32k;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-observatory.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # Everything else goes to the front controller.
    location / {
        limit_except GET HEAD { deny all; }
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-observatory.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }
}
