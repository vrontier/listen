# ============================================================================
# listen.home.arpa — Listening Observatory (dev/staging on taurus)
#
# File:    /etc/nginx/sites-available/listen.home.arpa
# Symlink: /etc/nginx/sites-enabled/listen.home.arpa
# Source:  github.com/vrontier/listen, deploy/nginx/ (installed by
#          scripts/deploy-taurus.sh; edit there, not here)
#
# Site:     /var/www/listen.home.arpa (PHP front controller, own FPM pool "listen")
# Upstream: one listen-listener@<slug> per source, routed by the generated
#           snippets/listen-sources.conf (/<slug>/ws/…, /<slug>/api/…)
# Access:   home LAN and WireGuard only.
#
# TLS: service-specific leaf for listen.home.arpa signed by the "home.arpa
# Internal CA" (CA on nubes). The key was generated on taurus and never left
# it; the certificate is valid for 397 days.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name listen.home.arpa;

    allow 10.0.0.0/24;
    allow 10.99.0.0/16;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name listen.home.arpa;

    ssl_certificate     /etc/ssl/home-arpa/listen.crt;
    ssl_certificate_key /etc/ssl/home-arpa/listen.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    allow 10.0.0.0/24;
    allow 10.99.0.0/16;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    include snippets/security-headers.conf;

    root /var/www/listen.home.arpa;

    # The site is read-only except for the contact form.
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 444;
    }

    # _lib, _view and _config are never served; neither are dotfiles.
    location ^~ /_ { return 404; }
    location ~ /\. { deny all; }

    # Static assets are cache-busted by ?v=mtime (asset() in bootstrap.php).
    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
    }

    # Per-source listener routes (/<slug>/ws/…, /<slug>/api/…), generated by
    # scripts/deploy-taurus.sh from site/_config/sources.json.
    include snippets/listen-sources.conf;

    # The contact form is the only page that accepts POST.
    location = /contact {
        limit_except GET HEAD POST { deny all; }
        client_max_body_size 32k;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-listen.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # Everything else goes to the front controller, which answers real 404s.
    location / {
        limit_except GET HEAD { deny all; }
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-listen.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    access_log /var/log/nginx/listen.home.arpa-access.log combined_plus;
    error_log  /var/log/nginx/listen.home.arpa-error.log;
}
