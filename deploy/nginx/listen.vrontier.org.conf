# ============================================================================
# listen.vrontier.org — Listening Observatory (production on ionos)
#
# File:    /etc/nginx/sites-available/listen.vrontier.org
# Source:  github.com/vrontier/listen, deploy/nginx/ (installed by the root
#          step of scripts/deploy-ionos.sh; edit there, not here)
#
# Site:     /var/www/listen.vrontier.org, PHP front controller in the
#           dedicated FPM pool "listen" (user listen-web)
# Upstream: one listen-listener@<slug> per source on 127.0.0.1, routed by the
#           generated snippets/listen-sources.conf (/<slug>/ws/…, /<slug>/api/…)
#
# TLS: the *.vrontier.org Sectigo wildcard shared with vrontier.org (valid to 2027-02-25).
# HSTS includeSubDomains (security-headers.conf) — stay HTTPS-only.
# ============================================================================

server {
    include snippets/error-pages.conf;
    listen 80;
    listen [::]:80;
    server_name listen.vrontier.org;

    location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress|wp-json|xmlrpc\.php) { access_log off; return 444; }
    location ~* ^/(\.env|\.git|\.svn|\.htaccess|\.htpasswd|\.DS_Store) { access_log off; return 444; }
    location ~* ^/(admin|administrator|phpmyadmin|pma|mysql|myadmin|dbadmin|cgi-bin) { access_log off; return 444; }
    location ~* ^/(api|graphql|rest|v1|v2)(/|$) { access_log off; return 444; }
    location ~* \.(asp|aspx|jsp|cgi|sql|bak|old|orig|save|swp|conf|ini)$ { access_log off; return 444; }
    location ~* /\.aider\. { access_log off; return 444; }

    location / { return 301 https://listen.vrontier.org$request_uri; }
}

server {
    include snippets/error-pages.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name listen.vrontier.org;

    ssl_certificate /etc/ssl/vrontier.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/vrontier.org/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Server level; inherited by any location that declares no add_header
    include snippets/security-headers.conf;

    root /var/www/listen.vrontier.org;
    index index.php;

    # Request filtering. POST is accepted only by /contact (see below).
    if ($http_user_agent = "") { return 444; }
    if ($bad_bot) { return 444; }
    if ($bad_referer) { return 444; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 444; }

    # Request limits
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;

    # Honeypot: scanner paths — return 444
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress|wp-json|xmlrpc\.php) { access_log off; return 444; }
    location ~* ^/(\.env|\.git|\.svn|\.htaccess|\.htpasswd|\.DS_Store) { access_log off; return 444; }
    location ~* ^/(admin|administrator|phpmyadmin|pma|mysql|myadmin|dbadmin|cgi-bin) { access_log off; return 444; }
    location ~* ^/(api|graphql|rest|v1|v2)(/|$) { access_log off; return 444; }
    location ~* \.(asp|aspx|jsp|cgi|sql|bak|old|orig|save|swp|conf|ini)$ { access_log off; return 444; }
    location ~* /\.aider\. { access_log off; return 444; }

    location = /favicon.ico { log_not_found off; access_log off; return 404; }

    # _lib, _view and _config are never served; neither are dotfiles.
    # (^~ prefix locations win over the regex locations above and below.)
    location ^~ /_ { return 404; }
    location ~ /\. { deny all; }

    # Static assets are cache-busted by ?v=mtime (asset() in bootstrap.php).
    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=static burst=50 nodelay;
        include snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Per-source listener routes (/<slug>/ws/…, /<slug>/api/…), generated by
    # scripts/gen-sources.sh from site/_config/sources.json.
    include snippets/listen-sources.conf;

    # The contact form is the only page that accepts POST.
    location = /contact {
        limit_except GET HEAD POST { deny all; }
        limit_req zone=general burst=20 nodelay;
        limit_conn perip 20;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-listen.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 30s;
    }

    # Only index.php runs, and only through the front controller.
    location ~ \.php$ { return 404; }

    # Everything else goes to the front controller, which answers real 404s.
    location / {
        limit_except GET HEAD { deny all; }
        limit_req zone=general burst=20 nodelay;
        limit_conn perip 20;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-listen.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 30s;
    }
}
