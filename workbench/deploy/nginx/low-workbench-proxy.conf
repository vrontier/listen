# Proxy to the Workbench process. Installed as
# /etc/nginx/snippets/low-workbench-proxy.conf by deploy/install.sh.
# The Workbench sets its own security headers.

client_max_body_size 64k;

location /static/ {
    proxy_pass http://127.0.0.1:8110;
    proxy_set_header Host $host;
    expires 1h;
}

# Live events (Server-Sent Events) need nothing of their own here: the
# Workbench turns buffering off for them (X-Accel-Buffering: no) and sends
# a ping every 20 s, well within the read timeout.
location / {
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}
