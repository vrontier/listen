# Proxy to the Workbench process. Installed as
# /etc/nginx/snippets/low-workbench-proxy.conf by deploy/install.sh.
# The Workbench sets its own security headers.

client_max_body_size 64k;

# Live data of an analysis: Server-Sent Events, held open for hours.
location ~ ^/account/streams/[^/]+/analyses/[0-9]+/live$ {
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location /static/ {
    proxy_pass http://127.0.0.1:8110;
    proxy_set_header Host $host;
    expires 1h;
}

location / {
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}
