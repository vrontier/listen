# low.home.arpa — Listening Observatory Workbench on the intranet
#
# Installed by deploy/install.sh as /etc/nginx/sites-available/low.home.arpa;
# edit it here, not on the server.
#
# Upstream: low-workbench on 127.0.0.1:8110. Access: only the networks in
# snippets/low-allow.conf, written by install.sh from INTRANET_ALLOW in the
# untracked deploy/local.mk; without it, only the host itself.
#
# TLS: leaf for low.home.arpa signed by the internal home.arpa CA. Until
# /etc/ssl/home-arpa/low.crt exists, install.sh installs only the plain HTTP
# server below (the part between the HTTPS markers is left out) and the
# Workbench runs with an http:// base address.

#HTTP-ONLY-BEGIN
server {
    listen 80;
    listen [::]:80;
    server_name low.home.arpa;

    include snippets/low-allow.conf;

    include snippets/low-workbench-proxy.conf;

    access_log /var/log/nginx/low.home.arpa-access.log combined;
    error_log  /var/log/nginx/low.home.arpa-error.log;
}
#HTTP-ONLY-END

#HTTPS-BEGIN
server {
    listen 80;
    listen [::]:80;
    server_name low.home.arpa;

    include snippets/low-allow.conf;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name low.home.arpa;

    ssl_certificate     /etc/ssl/home-arpa/low.crt;
    ssl_certificate_key /etc/ssl/home-arpa/low.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    include snippets/low-allow.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include snippets/low-workbench-proxy.conf;

    access_log /var/log/nginx/low.home.arpa-access.log combined;
    error_log  /var/log/nginx/low.home.arpa-error.log;
}
#HTTPS-END
